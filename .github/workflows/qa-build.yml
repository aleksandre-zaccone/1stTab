name: QA Build (PRs)

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: bash build.sh

      - name: Upload Artifact for QA
        uses: actions/upload-artifact@v4
        with:
          name: 1stTab-QA-Build
          path: 1stTab.zip
