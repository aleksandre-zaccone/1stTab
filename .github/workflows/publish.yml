name: Publish to Chrome Web Store

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version from Release Tag
        id: version
        run: |
          # Extract the tag name (e.g., "v1.2.3") and remove the leading "v" if it exists
          TAG_NAME="${{ github.event.release.tag_name }}"
          NEW_VERSION="${TAG_NAME#v}"
          
          # Inject the new version into manifest.json
          jq ".version = \"$NEW_VERSION\"" manifest.json > tmp.json && mv tmp.json manifest.json
          
          # Optional: sync package.json if it exists
          if [ -f package.json ]; then
            npm version $NEW_VERSION --no-git-tag-version || true
          fi
          
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: bash build.sh

      - name: Publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx chrome-webstore-upload-cli@latest upload \
            --source 1stTab.zip \
            --publisher-id "$PUBLISHER_ID" \
            --auto-publish

      - name: Commit manifest.json version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          git add manifest.json package.json package-lock.json || true
          # The || true prevents failure if there is nothing to commit
          git commit -m "chore: sync version to ${{ steps.version.outputs.new }} from release [skip ci]" || true
          git push origin main || true
