name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v2.0.0)
        required: true
        type: string
      operation:
        description: Check access only, or upload and submit for review
        required: true
        default: check
        type: choice
        options: [check, submit]

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release version and branch
        run: |
          node scripts/check-release.mjs "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: bash build.sh

      - name: Save verified store package
        uses: actions/upload-artifact@v4
        with:
          name: 1stTab-Chrome-Web-Store-${{ github.event.release.tag_name || inputs.tag }}
          path: dist/1stTab-bookmarks.zip
          if-no-files-found: error

      - name: Check Chrome Web Store access
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node scripts/check-store-access.mjs

      - name: Upload and submit to Chrome Web Store
        if: github.event_name == 'release' || inputs.operation == 'submit'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        # No subcommand means upload AND publish. `upload --auto-publish` only uploads.
        run: |
          npx --yes chrome-webstore-upload-cli@4.0.2 \
            --source dist/1stTab-bookmarks.zip \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID"

      - name: Read submission status
        if: github.event_name == 'release' || inputs.operation == 'submit'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node scripts/check-store-access.mjs
